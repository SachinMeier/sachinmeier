<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sachin Meier</title>
  <!-- Source for og/world.png, the social preview image of the root page. Rendered at 1200x630. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #000000; color: #FFFFFF;
      font-family: "Geist Mono", ui-monospace, monospace;
      display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-weight: 500; font-size: 74px; line-height: 1;
      letter-spacing: 0.6em; text-transform: uppercase; white-space: nowrap;
      /* one cell between letters, two between words, as on the page; centre the glyphs, not the trailing space */
      margin-right: -0.6em;
    }
    .land { color: #5CC66A; }
    .sea { color: #4F93F5; }
    .sand { color: #D9B98C; }
  </style>
</head>
<body>
  <h1><span class="land">Sach</span><span class="sea">in M</span><span class="sand">eier</span></h1>

</html>
