  <script type="module">
    import * as THREE from 'three';

    const out = document.getElementById('ascii');
    const ctx = out.getContext('2d', { alpha: false });
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // The name, locked into the grid. Letters are spaced one cell apart, with an extra cell between words.
    const NAME = 'S A C H I N  M E I E R';
    const nameColors = new Array(NAME.length).fill('#FFFFFF');

    const RAMP = ' .:+#';
    const FONT_PX = 12;
    const BAYER = [
      [ 0, 32,  8, 40,  2, 34, 10, 42], [48, 16, 56, 24, 50, 18, 58, 26],
      [12, 44,  4, 36, 14, 46,  6, 38], [60, 28, 52, 20, 62, 30, 54, 22],
      [ 3, 35, 11, 43,  1, 33,  9, 41], [51, 19, 59, 27, 49, 17, 57, 25],
      [15, 47,  7, 39, 13, 45,  5, 37], [63, 31, 55, 23, 61, 29, 53, 21],
    ].map((r) => r.map((v) => (v + 0.5) / 64));

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'low-power' });
    } catch (e) {
      throw e;
    }
    renderer.setPixelRatio(1);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 50);
    // Night side: a little ambient plus a faint camera fill so the silhouette never vanishes.
    scene.add(new THREE.AmbientLight(0xffffff, 0.2));
    const fill = new THREE.DirectionalLight(0xffffff, 0.12); fill.position.set(0, 0, 5); scene.add(fill);

    // Two textures from NASA Blue Marble data. world.png drives character density (land bright,
    // ocean dim). classes.png encodes a terrain class per texel in its red channel, which picks
    // the color: three ocean depths, then green, tan, gray and white land.
    const worldTex = new THREE.TextureLoader().load('world/world.png', () => { dirty = true; });
    worldTex.colorSpace = THREE.SRGBColorSpace;
    const classTex = new THREE.TextureLoader().load('world/classes.png', () => { dirty = true; });
    classTex.colorSpace = THREE.NoColorSpace;
    classTex.magFilter = THREE.NearestFilter; classTex.minFilter = THREE.NearestFilter; classTex.generateMipmaps = false;
    const CLASS_STEP = 36;
    // The last class is the moon, which has no texel in classes.png and is painted by its own material.
    const PALETTE = ['#2A64E0', '#4F93F5', '#93CEFF', '#5CC66A', '#D9B98C', '#A3A3A3', '#F5F5F5', '#CFCAC0'];
    const MOON_CLASS = PALETTE.length - 1;
    // Each color at four brightness levels, night to day, so rows still draw as long runs.
    const SHADES = [0.38, 0.58, 0.8, 1.0];
    const SHADED = PALETTE.map((hex) => SHADES.map((f) => {
      const n = parseInt(hex.slice(1), 16);
      const c = (v) => Math.round(v * f).toString(16).padStart(2, '0');
      return '#' + c(n >> 16) + c((n >> 8) & 255) + c(n & 255);
    }));
    // Albedo of the density texture per class, in linear light, used to recover pure illumination from the lit pass.
    const ALBEDO = [0.223, 0.223, 0.223, 1, 1, 1, 1, 1];
    // City lights, drawn on the night side from the green channel of the class texture.
    // Four brightness steps, each with its own glyph and warm color, dim amber to near white.
    const LIGHT_RAMP = ['.', ':', '+', '#'];
    const LIGHT_COLORS = ['#A07E3C', '#D9B45A', '#F5DC8C', '#FFF4CF'];
    const NIGHT_START = 0.42, NIGHT_END = 0.7;   // illumination where lights are fully on, and where they are gone
    const LIGHT_STEPS = [0.08, 0.3, 0.55, 0.8];   // glow thresholds for each ramp step; the top one is reserved for city cores

    const litMat = new THREE.MeshStandardMaterial({ map: worldTex, emissive: 0xffffff, emissiveMap: worldTex, emissiveIntensity: 0.2, roughness: 0.9, metalness: 0 });
    const classMat = new THREE.MeshBasicMaterial({ map: classTex });
    const globe = new THREE.Mesh(new THREE.SphereGeometry(1.0, 96, 64), litMat);

    // Daylight. The sun is a child of the globe, so it turns with the Earth and the terminator
    // stays on the right geography no matter how the globe is spun. Its direction comes from the
    // clock: solar declination from the day of the year, subsolar longitude from UTC time with
    // the equation of time applied.
    const sun = new THREE.DirectionalLight(0xffffff, 2.6);
    globe.add(sun); globe.add(sun.target);
    sun.target.position.set(0, 0, 0);
    function sunDirection(date) {
      const dayOfYear = Math.floor((date - Date.UTC(date.getUTCFullYear(), 0, 0)) / 86400000);
      const decl = (23.44 * Math.PI / 180) * Math.sin(2 * Math.PI * (284 + dayOfYear) / 365);
      const B = 2 * Math.PI * (dayOfYear - 81) / 364;
      const eotMinutes = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
      const hours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
      const lon = -15 * (hours + eotMinutes / 60 - 12) * Math.PI / 180;
      return latLonToVector(decl, lon);
    }
    // Map latitude and longitude (radians, east positive) onto the sphere's texture frame: u = 0 is longitude -180.
    function latLonToVector(lat, lon) {
      const theta = Math.PI / 2 - lat, phi = lon + Math.PI;
      return new THREE.Vector3(-Math.cos(phi) * Math.sin(theta), Math.cos(theta), Math.sin(phi) * Math.sin(theta));
    }
    function updateSun() { sun.position.copy(sunDirection(new Date()).multiplyScalar(10)); dirty = true; }
    scene.add(globe);

    // The moon. Like the sun it is a child of the globe, so it keeps its place over the right
    // geography as the globe is spun, and the same sunlight gives it the right phase. Its
    // direction comes from a low precision lunar ephemeris: ecliptic longitude and latitude from
    // the date, tilted onto the equator, then turned into Earth-fixed longitude with sidereal
    // time. The orbit therefore runs along the ecliptic, 18 to 29 degrees off the equator,
    // rather than around the equator. The orbit radius is compressed to fit the screen, and the
    // moon's clock runs fast so the orbit is visible: one orbit takes SPINS_PER_ORBIT turns of
    // the globe's idle spin. The real Earth turns about 27.3 times per lunar orbit.
    const AUTO = reduced ? 0 : 0.0024;              // idle spin, radians per frame
    const SPIN_S = 2 * Math.PI / 0.0024 / 60;       // seconds per idle turn at 60 fps, about 44
    const SPINS_PER_ORBIT = 2;
    const MOON_R = 0.2;             // relative to Earth; the true ratio is 0.27
    const MOON_ORBIT = 1.45;        // true value is about 60; this one keeps it on screen
    const MOON_PERIOD_S = SPINS_PER_ORBIT * SPIN_S;
    const MOON_SPEEDUP = reduced ? 1 : 27.32 * 86400 / MOON_PERIOD_S;
    const DEG = Math.PI / 180, J2000 = Date.UTC(2000, 0, 1, 12);
    // The orbit (longitude, latitude) is evaluated on the fast clock, but the Earth's own turn
    // relative to the stars (sidereal time) uses the real clock, so speeding the moon up does
    // not also spin it around the globe once per simulated day.
    function moonDirection(orbitDate, realDate) {
      const D = (orbitDate - J2000) / 86400000;             // days since J2000
      const L = (218.316 + 13.176396 * D) * DEG;            // mean longitude
      const M = (134.963 + 13.064993 * D) * DEG;            // mean anomaly
      const F = (93.272 + 13.229350 * D) * DEG;             // argument of latitude
      const lambda = L + 6.289 * DEG * Math.sin(M);         // ecliptic longitude
      const beta = 5.128 * DEG * Math.sin(F);               // ecliptic latitude, from the 5.1 degree inclination
      // Ecliptic to equatorial.
      const eps = 23.439 * DEG;
      const x = Math.cos(beta) * Math.cos(lambda), y = Math.cos(beta) * Math.sin(lambda), z = Math.sin(beta);
      const ra = Math.atan2(y * Math.cos(eps) - z * Math.sin(eps), x);
      const dec = Math.asin(y * Math.sin(eps) + z * Math.cos(eps));
      // Equatorial to Earth-fixed: longitude is right ascension minus Greenwich sidereal time.
      const gmst = (280.46061837 + 360.98564736629 * ((realDate - J2000) / 86400000)) * DEG;
      return latLonToVector(dec, ra - gmst);
    }
    // The moon's density map: a bright disc pocked with craters, drawn once. The large dark maria
    // sit on the near side (u around 0.25, the face lookAt points at Earth), as on the real moon,
    // so the tidally locked face is recognizable.
    const moonTex = (() => {
      const c = document.createElement('canvas'); c.width = 512; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height);
      let seed = 7;
      const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      const spot = (u, v, r, shade) => { g.fillStyle = shade; g.beginPath(); g.arc(u * c.width, v * c.height, r, 0, Math.PI * 2); g.fill(); };
      for (let i = 0; i < 7; i++) spot(0.12 + rnd() * 0.26, 0.25 + rnd() * 0.45, 25 + rnd() * 30, '#8C8C8C');
      for (let i = 0; i < 60; i++) spot(rnd(), rnd(), 3 + rnd() * 10, '#7A7A7A');
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    })();
    // The moon is lit only by the sun, through its own shader, so the scene's ambient and
    // camera fill lights (which keep the Earth's night side visible) do not wash out its phase.
    // Its night side gets a faint earthshine: sunlight bounced off the Earth, from the Earth's direction.
    const EARTHSHINE = 0.1;
    const moonLitMat = new THREE.ShaderMaterial({
      uniforms: { map: { value: moonTex }, sunDir: { value: new THREE.Vector3(0, 0, 1) }, earthDir: { value: new THREE.Vector3(0, 0, 1) }, earthshine: { value: EARTHSHINE } },
      vertexShader: `
        varying vec3 vNormalW; varying vec2 vUv;
        void main() {
          vNormalW = normalize(mat3(modelMatrix) * normal); vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform sampler2D map; uniform vec3 sunDir; uniform vec3 earthDir; uniform float earthshine;
        varying vec3 vNormalW; varying vec2 vUv;
        void main() {
          vec3 n = normalize(vNormalW);
          float light = max(dot(n, sunDir), 0.0) * 1.3 + max(dot(n, earthDir), 0.0) * earthshine;
          gl_FragColor = vec4(texture2D(map, vUv).rgb * light, 1.0);
        }`,
    });
    // Red channel 7 * CLASS_STEP selects the moon's palette entry; green 0 means no city lights.
    const moonClassMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(7 * CLASS_STEP / 255, 0, 0) });
    const moon = new THREE.Mesh(new THREE.SphereGeometry(MOON_R, 48, 32), moonLitMat);
    globe.add(moon);
    const moonEpoch = Date.now();
    const moonWorld = new THREE.Vector3();
    function placeMoon() {
      const now = Date.now(), simulated = moonEpoch + (now - moonEpoch) * MOON_SPEEDUP;
      moon.position.copy(moonDirection(simulated, now).multiplyScalar(MOON_ORBIT));
      moon.lookAt(0, 0, 0);   // tidally locked: the same face always points at Earth
      // Feed the shader the sun's direction and the Earth's direction, both in world space.
      // The globe's spin moves the sun in world space, so this is refreshed every frame.
      sun.getWorldPosition(moonLitMat.uniforms.sunDir.value).normalize();
      moon.getWorldPosition(moonWorld);
      moonLitMat.uniforms.earthDir.value.copy(moonWorld).negate().normalize();
    }
    placeMoon();
    // Apollo 11's flag at Tranquility Base, on the side that faces Earth: a blue dot and a red
    // stripe, drawn over the cell the site projects to whenever that cell shows the moon's
    // lit surface facing the camera. In the moon's own frame lookAt points +z at Earth.
    const FLAG_LOCAL = new THREE.Vector3(Math.sin(23.5 * DEG), Math.sin(0.7 * DEG), Math.cos(23.5 * DEG)).normalize().multiplyScalar(MOON_R);
    const flagPos = new THREE.Vector3(), flagNormal = new THREE.Vector3(), toCam = new THREE.Vector3();
    function drawFlag() {
      moon.localToWorld(flagPos.copy(FLAG_LOCAL));
      moon.getWorldPosition(moonWorld);
      flagNormal.subVectors(flagPos, moonWorld);
      toCam.subVectors(camera.position, flagPos);
      if (flagNormal.dot(toCam) <= 0) return;   // the site is on the far side from the camera
      flagPos.project(camera);
      const x = Math.floor((flagPos.x + 1) / 2 * cols), y = Math.floor((1 - flagPos.y) / 2 * rows);
      if (x < 0 || x + 1 >= cols || y < 0 || y >= rows) return;
      const i = ((rows - 1 - y) * cols + x) * 4;
      // Only where the cell actually shows the moon (not hidden behind the Earth) and the surface is lit.
      if (Math.round(cbuf[i] / CLASS_STEP) !== MOON_CLASS || buf[i] + buf[i + 1] + buf[i + 2] === 0) return;
      ctx.fillStyle = '#000000'; ctx.fillRect(x * cellW, y * cellH, cellW * 2, cellH);
      ctx.fillStyle = '#5B7CFF'; ctx.fillText('.', x * cellW, y * cellH);
      ctx.fillStyle = '#FF4A4A'; ctx.fillText('=', (x + 1) * cellW, y * cellH);
    }

    // Orientation lives in a quaternion so the globe can turn on any axis.
    // Start tilted 23.4 degrees with the Pacific facing the camera.
    const REST_YAW = Math.PI / 2 - 2 * Math.PI * 0.055;
    globe.quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -23.4 * Math.PI / 180)
      .multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), REST_YAW));

    // The orientation persists across reloads.
    const POSE_KEY = 'world-pose';
    let lastSave = 0;
    (function restore() {
      try {
        const q = JSON.parse(localStorage.getItem(POSE_KEY));
        if (Array.isArray(q) && q.length === 4 && q.every(Number.isFinite) && Math.hypot(...q) > 0.5) {
          globe.quaternion.set(q[0], q[1], q[2], q[3]).normalize();
        }
      } catch (e) {}
    })();
    function savePose(force) {
      const now = performance.now();
      if (!force && now - lastSave < 1000) return;
      lastSave = now;
      try { localStorage.setItem(POSE_KEY, JSON.stringify(globe.quaternion.toArray())); } catch (e) {}
    }

    const spin = new THREE.Vector3();        // inertial angular velocity, world space, radians per frame
    const tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3();
    let dragging = false, lastX = 0, lastY = 0, lastT = 0, idleUntil = 0, dirty = true;
    updateSun();
    setInterval(updateSun, 60 * 1000);
    const DRAG = 0.008;
    const RAMP_MS = 2500;   // time for the idle spin to reach full speed after a drag
    const PAUSE_MS = 300;   // quiet moment after releasing before the ramp begins

    // Rotate about a world space axis by an angle
    function turn(axisX, axisY, axisZ, angle) {
      if (angle === 0) return;
      tmpV.set(axisX, axisY, axisZ).normalize();
      tmpQ.setFromAxisAngle(tmpV, angle);
      globe.quaternion.premultiply(tmpQ);
    }

    let cols = 0, rows = 0, cellW = 0, cellH = FONT_PX, rt = null, buf = null, cbuf = null, glowBuf = null, nameRow = 0, nameCol = 0;
    // Per frame easing of a cell's city glow. Rise fast so a city core registers as it passes over a cell;
    // fall slowly so lights fade out instead of sparkling.
    const GLOW_RISE = 0.45, GLOW_FALL = 0.1;
    const fontNormal = `${FONT_PX}px "Geist Mono", ui-monospace, monospace`;
    const fontBold = `600 ${FONT_PX}px "Geist Mono", ui-monospace, monospace`;

    function layout() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth, h = window.innerHeight;
      out.width = Math.round(w * dpr); out.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = fontNormal;
      ctx.textBaseline = 'top';
      cellW = ctx.measureText('M').width || FONT_PX * 0.6;
      cols = Math.max(8, Math.floor(w / cellW));
      rows = Math.max(8, Math.floor(h / cellH));
      nameRow = Math.floor(rows / 2);
      nameCol = Math.floor((cols - NAME.length) / 2);
      camera.aspect = (cols * cellW) / (rows * cellH);
      // Fit the globe (diameter 2) plus the moon's orbit inside the narrower axis with a little
      // margin. The orbit can lie at any angle to the screen, so fit the whole sphere it sweeps,
      // including the extra reach the moon has in perspective when it is nearest the camera.
      const halfFov = (camera.fov / 2) * Math.PI / 180;
      const narrow = Math.min(camera.aspect, 1);
      let half = 1.45;
      for (let pass = 0; pass < 2; pass++) {
        const dist = half / (Math.tan(halfFov) * narrow);
        half = 1.45;
        for (let a = 0; a < 2 * Math.PI; a += 0.05) {
          half = Math.max(half, dist * (MOON_ORBIT * Math.cos(a) + MOON_R + 0.06) / (dist - MOON_ORBIT * Math.sin(a)));
        }
      }
      camera.position.set(0, 0, half / (Math.tan(halfFov) * narrow));
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();
      renderer.setSize(cols, rows, false);
      if (rt) rt.dispose();
      rt = new THREE.WebGLRenderTarget(cols, rows, { depthBuffer: true });
      buf = new Uint8Array(cols * rows * 4);
      cbuf = new Uint8Array(cols * rows * 4);
      glowBuf = new Float32Array(cols * rows);
      dirty = true;
    }

    function draw() {
      // Pass 1: lit globe, gives the character for each cell.
      globe.material = litMat; moon.material = moonLitMat;
      renderer.setRenderTarget(rt);
      renderer.render(scene, camera);
      renderer.readRenderTargetPixels(rt, 0, 0, cols, rows, buf);
      // Pass 2: unlit class map, gives the color for each cell.
      globe.material = classMat; moon.material = moonClassMat;
      renderer.render(scene, camera);
      renderer.readRenderTargetPixels(rt, 0, 0, cols, rows, cbuf);
      renderer.setRenderTarget(null);

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.font = fontNormal;
      const levels = RAMP.length - 1;
      for (let y = 0; y < rows; y++) {
        const srcY = rows - 1 - y;
        // Draw each row as runs of same colored characters.
        let run = '', runColor = null, runStart = 0;
        for (let x = 0; x < cols; x++) {
          const i = (srcY * cols + x) * 4;
          const lum = (0.2126 * buf[i] + 0.7152 * buf[i + 1] + 0.0722 * buf[i + 2]) / 255;
          const q = Math.floor(lum * levels + BAYER[y & 7][x & 7]);
          let c = RAMP[Math.min(levels, Math.max(0, q))];
          const nameIdx = y === nameRow && x >= nameCol && x < nameCol + NAME.length && NAME[x - nameCol] !== ' ' ? x - nameCol : -1;
          const onGlobe = buf[i] + buf[i + 1] + buf[i + 2] > 0;
          let color = runColor;
          if (c !== ' ' || (nameIdx >= 0 && onGlobe)) {
            const cls = Math.min(PALETTE.length - 1, Math.round(cbuf[i] / CLASS_STEP));
            const light = Math.min(1, lum / ALBEDO[cls]);
            color = SHADED[cls][Math.min(3, Math.floor(light * 4))];
            // Night lights fade in as the terminator passes.
            const night = 1 - Math.min(1, Math.max(0, (light - NIGHT_START) / (NIGHT_END - NIGHT_START)));
            // Ease each cell toward its target so lights breathe in and out instead of glittering.
            const gi = y * cols + x;
            const target = (cbuf[i + 1] / 255) * night, prev = glowBuf[gi];
            const glow = glowBuf[gi] = prev + (target - prev) * (target > prev ? GLOW_RISE : GLOW_FALL);
            if (glow > LIGHT_STEPS[0]) {
              const k = glow > LIGHT_STEPS[3] ? 3 : glow > LIGHT_STEPS[2] ? 2 : glow > LIGHT_STEPS[1] ? 1 : 0;
              c = LIGHT_RAMP[k]; color = LIGHT_COLORS[k];
            }
          }
          if (nameIdx >= 0) {
            // The name sits on the Earth, so a moon passing in front covers it: the cell keeps the
            // moon's character (or stays dark on the moon's night side) and the letter is skipped.
            if (Math.round(cbuf[i] / CLASS_STEP) === MOON_CLASS) nameColors[nameIdx] = null;
            else {
              // The letter takes the color of the cell beneath it, white where there is no globe.
              nameColors[nameIdx] = onGlobe ? color : '#FFFFFF';
              c = ' ';
            }
          }
          if (color !== runColor && run.trim() !== '') {
            ctx.fillStyle = runColor; ctx.fillText(run, runStart * cellW, y * cellH);
            run = ''; runStart = x;
          } else if (color !== runColor) { run = ''; runStart = x; }
          runColor = color;
          run += c;
        }
        if (run.trim() !== '') { ctx.fillStyle = runColor; ctx.fillText(run, runStart * cellW, y * cellH); }
      }
      drawFlag();
      ctx.font = fontBold;
      for (let k = 0; k < NAME.length; k++) {
        if (NAME[k] === ' ' || !nameColors[k]) continue;
        ctx.fillStyle = nameColors[k];
        ctx.fillText(NAME[k], (nameCol + k) * cellW, nameRow * cellH);
      }
    }

    function tick() {
      requestAnimationFrame(tick);
      if (!rt || document.hidden) return;
      const now = performance.now();
      if (dragging) dirty = true;
      else {
        // Flick inertia decays on its own axis.
        if (spin.length() > 0.0002) { turn(spin.x, spin.y, spin.z, spin.length()); spin.multiplyScalar(0.94); dirty = true; }
        // The idle spin eases back in over RAMP_MS rather than snapping on, and blends with any leftover inertia.
        if (AUTO && now > idleUntil) {
          const t = Math.min(1, (now - idleUntil) / RAMP_MS);
          const rate = AUTO * t * t * (3 - 2 * t);
          if (rate > 0) { globe.rotateY(rate); dirty = true; }
        }
      }
      if (!reduced) { placeMoon(); dirty = true; }
      if (dirty) { draw(); dirty = false; savePose(false); }
    }

    // Drag anywhere to spin the globe freely. Horizontal drag turns about the screen's
    // vertical axis, vertical drag about its horizontal axis, and any mix in between.
    out.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); spin.set(0, 0, 0);
      document.body.classList.add('dragging'); try { out.setPointerCapture(e.pointerId); } catch (err) {}
    });
    out.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY, now = performance.now();
      const angle = Math.hypot(dx, dy) * DRAG;
      if (angle > 0) {
        turn(dy, dx, 0, angle);
        const k = 16 / Math.max(1, now - lastT);
        spin.set(dy, dx, 0).normalize().multiplyScalar(angle * k);
      }
      lastX = e.clientX; lastY = e.clientY; lastT = now;
    });
    const end = () => { if (!dragging) return; dragging = false; document.body.classList.remove('dragging'); idleUntil = performance.now() + PAUSE_MS; savePose(true); };
    out.addEventListener('pointerup', end);
    out.addEventListener('pointercancel', end);
    out.addEventListener('lostpointercapture', end);
    window.addEventListener('keydown', (e) => {
      const step = 0.12;
      if (e.key === 'ArrowLeft') turn(0, 1, 0, -step);
      else if (e.key === 'ArrowRight') turn(0, 1, 0, step);
      else if (e.key === 'ArrowUp') turn(1, 0, 0, -step);
      else if (e.key === 'ArrowDown') turn(1, 0, 0, step);
      else return;
      idleUntil = performance.now() + PAUSE_MS; dirty = true; e.preventDefault();
    });

    document.addEventListener('visibilitychange', () => { if (document.hidden) savePose(true); });
    window.addEventListener('pagehide', () => savePose(true));

    document.fonts.load(fontBold).finally(() => {
      layout();
      window.addEventListener('resize', layout);
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
