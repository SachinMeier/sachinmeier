  <script>
    // Drag the card anywhere, but never past the edge of the viewport.
    (function () {
      const card = document.getElementById('card');
      let offX = 0, offY = 0;          // current offset from the resting centered position
      let startX = 0, startY = 0, baseX = 0, baseY = 0, dragging = false;

      function restingRect() {
        // Measure the card where flex layout puts it, without the drag offset.
        const prev = card.style.transform;
        card.style.transform = 'none';
        const r = card.getBoundingClientRect();
        card.style.transform = prev;
        return r;
      }
      function clamp(x, y) {
        const r = restingRect();
        const minX = -r.left, maxX = window.innerWidth - r.right;
        const minY = -r.top, maxY = window.innerHeight - r.bottom;
        return [Math.min(maxX, Math.max(minX, x)), Math.min(maxY, Math.max(minY, y))];
      }
      function apply(x, y) {
        [offX, offY] = clamp(x, y);
        card.style.transform = `translate(${offX}px, ${offY}px)`;
      }

      card.addEventListener('pointerdown', (e) => {
        if (e.target.closest('a, button') || e.button !== 0) return;
        dragging = true;
        startX = e.clientX; startY = e.clientY; baseX = offX; baseY = offY;
        card.classList.add('dragging');
        try { card.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault();
      });
      card.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        apply(baseX + (e.clientX - startX), baseY + (e.clientY - startY));
      });
      const end = () => { if (!dragging) return; dragging = false; card.classList.remove('dragging'); };
      card.addEventListener('pointerup', end);
      card.addEventListener('pointercancel', end);
      card.addEventListener('lostpointercapture', end);
      window.addEventListener('resize', () => apply(offX, offY));
    })();
  </script>
